<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIBRAT - Образовательная платформа</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">GIBRAT</h1>
            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('profile')">Профиль</button>
                <button class="tab-btn" onclick="switchTab('courses')">Курсы</button>
                <button class="tab-btn" onclick="switchTab('lessons')">Уроки</button>
                <button class="tab-btn" onclick="switchTab('rating')">Рейтинг</button>
                <button class="tab-btn" onclick="switchTab('chat')">Чат</button>
                <button class="tab-btn logout" onclick="logout()">Выход</button>
            </nav>
        </header>

        <main class="content">
            <section id="profile" class="tab-content active"></section>
            <section id="courses" class="tab-content"></section>
            <section id="lessons" class="tab-content"></section>
            <section id="rating" class="tab-content"></section>
            <section id="chat" class="tab-content"></section>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
